<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Language Recognizer</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #video { display: none; }
  #canvas { width: 640px; height: 480px; border-radius: 6px; }
  #typedBar {
    margin-top: 15px;
    width: 640px;
    min-height: 40px;
    background: #222;
    border-radius: 6px;
    padding: 10px;
    font-size: 22px;
    letter-spacing: 1px;
  }
  #status { margin-top: 10px; color: #aaa; font-size: 14px; }
  #controls { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.15); }

  #quizModeBtn { background: #5865f2; border-color: #4752c4; color: #fff; font-weight: bold; }
  #exitQuizBtn { background: #444; }

  #quizPanel {
    margin-top: 15px;
    width: 640px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    display: none;
    text-align: center;
  }

  .difficulty-row { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
  .easy-btn { background: #2ecc71; border-color: #27ae60; color: #063; font-weight: bold; padding: 10px 20px; font-size: 15px; }
  .medium-btn { background: #f39c12; border-color: #d9820b; color: #4a2900; font-weight: bold; padding: 10px 20px; font-size: 15px; }

  #quizTargetLetter { font-size: 72px; font-weight: bold; color: #5865f2; margin: 10px 0; }
  #quizTimerBarOuter { width: 100%; height: 14px; background: #333; border-radius: 7px; overflow: hidden; margin: 10px 0; }
  #quizTimerBarInner { height: 100%; background: #5865f2; width: 100%; transition: width 0.1s linear; }
  #quizProgressText { color: #aaa; font-size: 14px; }
  #quizLiveScore { font-size: 18px; font-weight: bold; margin-top: 8px; }

  #scoreboard {
    margin-top: 15px;
    width: 640px;
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px;
    display: none;
  }
  #scoreboard h3 { margin: 0 0 8px 0; font-size: 16px; color: #ccc; }
  #scoreboardSummary { font-size: 15px; margin-bottom: 10px; }
  #scoreboardChips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-weight: bold;
    font-size: 14px;
  }
  .chip.correct { background: #2ecc71; color: #063; }
  .chip.wrong { background: #e74c3c; color: #3a0a05; }
</style>
</head>
<body>

<h2>Sign Language Alphabet Recognizer</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="640" height="480"></canvas>

<div id="typedBar"></div>

<div id="controls">
  <button id="spaceBtn">Space</button>
  <button id="backspaceBtn">Backspace</button>
  <button id="clearBtn">Clear</button>
  <a href="https://deafchildren.org/2019/06/free-asl-alphabet-chart/" target="_blank" rel="noopener noreferrer">
    <button type="button">ASL Alphabet Chart</button>
  </a>
  <button id="quizModeBtn">Quiz Mode</button>
</div>

<div id="quizPanel">
  <div id="quizSetup">
    <p>Choose a difficulty:</p>
    <div class="difficulty-row">
      <button class="easy-btn" id="easyBtn">Easy (8s per letter)</button>
      <button class="medium-btn" id="mediumBtn">Medium (4s per letter)</button>
    </div>
  </div>

  <div id="quizPlay" style="display:none;">
    <div id="quizProgressText">Letter 1 of 10</div>
    <div id="quizTargetLetter">A</div>
    <div id="quizTimerBarOuter"><div id="quizTimerBarInner"></div></div>
    <div id="quizLiveScore">Score: 0 / 0</div>
    <button id="exitQuizBtn">Exit Quiz</button>
  </div>
</div>

<div id="scoreboard">
  <h3>Last Quiz Attempt</h3>
  <div id="scoreboardSummary"></div>
  <div id="scoreboardChips"></div>
</div>

<div id="status">Loading model and camera...</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const typedBar = document.getElementById("typedBar");
const statusEl = document.getElementById("status");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [9,10],[10,11],[11,12],
  [13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17]
];

const STABILITY_FRAMES = 15;
const CONFIDENCE_MIN = 0.6;
const MOTION_WINDOW = 20;
const SMOOTHING_WINDOW = 4;

const ALPHABET = "abcdefghijklmnopqrstuvwxyz".split("");
const QUIZ_LENGTH = 10;
const QUIZ_TIME = { easy: 8, medium: 4 }; // seconds per letter

let typedText = "";
let streakLetter = null;
let streakCount = 0;
let locked = false;

let landmarkSmoothing = [];
let fingertipHistory = [];

let model = null;
let handLandmarker = null;

// ---- Quiz state ----
let quizMode = false;          // true while actively playing a round
let quizDifficulty = null;
let quizLetters = [];
let quizIndex = 0;
let quizScore = 0;
let quizResults = [];
let quizLetterStartMs = 0;

const quizPanel = document.getElementById("quizPanel");
const quizSetup = document.getElementById("quizSetup");
const quizPlay = document.getElementById("quizPlay");
const quizTargetLetterEl = document.getElementById("quizTargetLetter");
const quizProgressTextEl = document.getElementById("quizProgressText");
const quizTimerBarInner = document.getElementById("quizTimerBarInner");
const quizLiveScoreEl = document.getElementById("quizLiveScore");
const scoreboard = document.getElementById("scoreboard");
const scoreboardSummary = document.getElementById("scoreboardSummary");
const scoreboardChips = document.getElementById("scoreboardChips");

async function loadModel() {
  const response = await fetch("model.json");
  model = await response.json();
}

function normalizeLandmarks(landmarks) {
  const points = landmarks.map(p => [p.x, p.y, p.z]);
  const wrist = points[0];
  const shifted = points.map(p => [p[0] - wrist[0], p[1] - wrist[1], p[2] - wrist[2]]);
  const ref = shifted[9];
  const scale = Math.sqrt(ref[0] ** 2 + ref[1] ** 2 + ref[2] ** 2);
  const normalized = shifted.map(p =>
    scale > 0 ? [p[0] / scale, p[1] / scale, p[2] / scale] : p
  );
  return normalized.flat();
}

function averageArrays(arrays) {
  const len = arrays[0].length;
  const avg = new Array(len).fill(0);
  for (const arr of arrays) {
    for (let i = 0; i < len; i++) avg[i] += arr[i];
  }
  for (let i = 0; i < len; i++) avg[i] /= arrays.length;
  return avg;
}

function computeMotionFeatures(fingertipPath) {
  if (fingertipPath.length < 2) return [0, 0, 0, 0, 0, 0];
  let pathLength = 0;
  let directionChanges = 0;
  let prevDx = null, prevDy = null;
  const xs = fingertipPath.map(p => p[0]);
  const ys = fingertipPath.map(p => p[1]);
  for (let i = 1; i < fingertipPath.length; i++) {
    const [x1, y1] = fingertipPath[i - 1];
    const [x2, y2] = fingertipPath[i];
    const dx = x2 - x1, dy = y2 - y1;
    pathLength += Math.hypot(dx, dy);
    if (prevDx !== null) {
      if ((dx * prevDx < 0) || (dy * prevDy < 0)) directionChanges++;
    }
    prevDx = dx; prevDy = dy;
  }
  const start = fingertipPath[0];
  const end = fingertipPath[fingertipPath.length - 1];
  const netDisplacement = Math.hypot(end[0] - start[0], end[1] - start[1]);
  const straightness = pathLength > 0 ? netDisplacement / pathLength : 0;
  const bboxWidth = Math.max(...xs) - Math.min(...xs);
  const bboxHeight = Math.max(...ys) - Math.min(...ys);
  return [pathLength, netDisplacement, straightness, bboxWidth, bboxHeight, directionChanges];
}

function walkTree(tree, features) {
  let nodeIndex = 0;
  while (true) {
    const node = tree[nodeIndex];
    if (node.feature === -2) return node.probs;
    nodeIndex = features[node.feature] <= node.threshold ? node.left : node.right;
  }
}

function predict(features) {
  const numClasses = model.classes.length;
  const totals = new Array(numClasses).fill(0);
  for (const tree of model.trees) {
    const probs = walkTree(tree, features);
    for (let i = 0; i < numClasses; i++) totals[i] += probs[i];
  }
  const numTrees = model.trees.length;
  const avgProbs = totals.map(v => v / numTrees);
  let bestIndex = 0;
  for (let i = 1; i < avgProbs.length; i++) {
    if (avgProbs[i] > avgProbs[bestIndex]) bestIndex = i;
  }
  return { letter: model.classes[bestIndex], confidence: avgProbs[bestIndex] };
}

function drawHand(landmarks) {
  ctx.strokeStyle = "lime";
  ctx.lineWidth = 2;
  for (const [a, b] of HAND_CONNECTIONS) {
    const p1 = landmarks[a];
    const p2 = landmarks[b];
    ctx.beginPath();
    ctx.moveTo(p1.x * WIDTH, p1.y * HEIGHT);
    ctx.lineTo(p2.x * WIDTH, p2.y * HEIGHT);
    ctx.stroke();
  }
  ctx.fillStyle = "red";
  for (const p of landmarks) {
    ctx.beginPath();
    ctx.arc(p.x * WIDTH, p.y * HEIGHT, 4, 0, 2 * Math.PI);
    ctx.fill();
  }
}

function updateTypedBar() {
  typedBar.textContent = typedText || "…";
}

// ---- Quiz helpers ----
function pickQuizLetters(count) {
  // Shuffle a copy of the alphabet, then take the first `count` letters --
  // guarantees no repeats within a single quiz round.
  const shuffled = [...ALPHABET];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, count);
}

function startQuiz(difficulty) {
  quizDifficulty = difficulty;
  quizLetters = pickQuizLetters(QUIZ_LENGTH);
  quizIndex = 0;
  quizScore = 0;
  quizResults = [];
  quizMode = true;
  quizLetterStartMs = performance.now();

  quizSetup.style.display = "none";
  quizPlay.style.display = "block";
  scoreboard.style.display = "none";

  renderQuizPlayUI();
}

function advanceQuizLetter(wasCorrect) {
  quizResults.push({ letter: quizLetters[quizIndex], correct: wasCorrect });
  if (wasCorrect) quizScore++;
  quizIndex++;

  if (quizIndex >= quizLetters.length) {
    finishQuiz();
  } else {
    quizLetterStartMs = performance.now();
    renderQuizPlayUI();
  }
}

function finishQuiz() {
  quizMode = false;
  quizPanel.style.display = "none";

  const total = quizLetters.length;
  scoreboardSummary.textContent =
    `${quizDifficulty.charAt(0).toUpperCase() + quizDifficulty.slice(1)} difficulty — ${quizScore} / ${total} correct`;

  scoreboardChips.innerHTML = "";
  for (const r of quizResults) {
    const chip = document.createElement("div");
    chip.className = "chip " + (r.correct ? "correct" : "wrong");
    chip.textContent = r.letter.toUpperCase();
    scoreboardChips.appendChild(chip);
  }
  scoreboard.style.display = "block";
}

function renderQuizPlayUI() {
  quizTargetLetterEl.textContent = quizLetters[quizIndex].toUpperCase();
  quizProgressTextEl.textContent = `Letter ${quizIndex + 1} of ${quizLetters.length}`;
  quizLiveScoreEl.textContent = `Score: ${quizScore} / ${quizIndex}`;
  quizTimerBarInner.style.width = "100%";
}

function updateQuizTimer(nowMs) {
  if (!quizMode) return;
  const timeLimit = QUIZ_TIME[quizDifficulty];
  const elapsed = (nowMs - quizLetterStartMs) / 1000;
  const remaining = Math.max(0, timeLimit - elapsed);
  const pct = Math.max(0, (remaining / timeLimit) * 100);
  quizTimerBarInner.style.width = pct + "%";

  if (remaining <= 0) {
    advanceQuizLetter(false); // ran out of time -- counts as a miss
  }
}

document.getElementById("quizModeBtn").onclick = () => {
  scoreboard.style.display = "none";
  quizPanel.style.display = "block";
  quizSetup.style.display = "block";
  quizPlay.style.display = "none";
};
document.getElementById("easyBtn").onclick = () => startQuiz("easy");
document.getElementById("mediumBtn").onclick = () => startQuiz("medium");
document.getElementById("exitQuizBtn").onclick = () => {
  quizMode = false;
  quizPanel.style.display = "none";
};

document.getElementById("spaceBtn").onclick = () => { typedText += " "; updateTypedBar(); };
document.getElementById("backspaceBtn").onclick = () => { typedText = typedText.slice(0, -1); updateTypedBar(); };
document.getElementById("clearBtn").onclick = () => { typedText = ""; updateTypedBar(); };

document.addEventListener("keydown", (e) => {
  if (quizMode) return; // don't let typing controls interfere during a quiz
  if (e.code === "Space") { typedText += " "; updateTypedBar(); e.preventDefault(); }
  else if (e.code === "Backspace") { typedText = typedText.slice(0, -1); updateTypedBar(); }
});

function predictWebcam() {
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -WIDTH, 0, WIDTH, HEIGHT);
  ctx.restore();

  const nowMs = performance.now();
  const result = handLandmarker.detectForVideo(canvas, nowMs);

  let currentLetter = null;

  if (result.landmarks && result.landmarks.length > 0) {
    const landmarks = result.landmarks[0];
    drawHand(landmarks);

    const rawNormalized = normalizeLandmarks(landmarks);
    landmarkSmoothing.push(rawNormalized);
    if (landmarkSmoothing.length > SMOOTHING_WINDOW) landmarkSmoothing.shift();
    const smoothed = averageArrays(landmarkSmoothing);

    const fingertip = [smoothed[8 * 3], smoothed[8 * 3 + 1]];
    fingertipHistory.push(fingertip);
    if (fingertipHistory.length > MOTION_WINDOW) fingertipHistory.shift();

    const motionFeatures = computeMotionFeatures(fingertipHistory);
    const features = smoothed.concat(motionFeatures);

    const { letter, confidence } = predict(features);

    if (confidence >= CONFIDENCE_MIN) {
      currentLetter = letter;
      ctx.font = "bold 60px Arial";
      ctx.fillStyle = "lime";
      ctx.fillText(letter.toUpperCase(), 20, 80);
    }
  } else {
    landmarkSmoothing = [];
    fingertipHistory = [];
  }

  if (currentLetter !== null && currentLetter === streakLetter) {
    streakCount++;
  } else if (currentLetter !== null) {
    streakLetter = currentLetter;
    streakCount = 1;
    locked = false;
  } else {
    streakLetter = null;
    streakCount = 0;
    locked = false;
  }

  if (streakCount >= STABILITY_FRAMES && !locked) {
    locked = true;
    if (quizMode) {
      const target = quizLetters[quizIndex];
      advanceQuizLetter(streakLetter === target);
    } else {
      typedText += streakLetter;
      updateTypedBar();
    }
  }

  if (currentLetter && !quizMode) {
    const progress = Math.min(streakCount / STABILITY_FRAMES, 1);
    ctx.strokeStyle = "gray";
    ctx.strokeRect(20, 100, 200, 20);
    ctx.fillStyle = "lime";
    ctx.fillRect(20, 100, 200 * progress, 20);
  }

  if (quizMode) {
    updateQuizTimer(nowMs);
    quizLiveScoreEl.textContent = `Score: ${quizScore} / ${quizIndex}`;
  }

  requestAnimationFrame(predictWebcam);
}

async function init() {
  await loadModel();

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
    },
    runningMode: "VIDEO",
    numHands: 1
  });

  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  video.addEventListener("loadeddata", () => {
    statusEl.textContent = "Ready! Hold up a letter shape, or sign J/Z.";
    predictWebcam();
  });
}

init().catch(err => {
  statusEl.textContent = "Error: " + err.message;
  console.error(err);
});
</script>

</body>
</html>
